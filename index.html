<!DOCTYPE html>
<html lang="es" data-skin="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Tech</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABmJLR0QA/wD/AP+gvaeTAAAgAElEQVR4nO3de5wkdX3v//e3+ja3ndllF9gLIOCCQWAhyP0WEUS5BI0KaIzRJF7Pzx8aNXpifsaTqMdgTgjQxBFV5D2mVJ/0fN8N9z3NqylzIYhS5v1bJmQ2dVe88x2cXbKQib3A8nB4VXoS1YQfkvwAAAABJRU5ErkJggg==">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root, [data-skin="classic"]{ --bg:#0d0e11; --panel-a:#34373f; --panel-b:#23262c; --edge:#111; --lcd-bg:#00140a; --lcd-txt:#3dff7a; --accent:#e9b949; --muted:#7a8091; --text:#e6e8ee; --red:#ff4d4d; --list-bg:#101216; --btn-a:#4a4e58; --btn-b:#2e3138; --viz-bg:#000; }
[data-skin="neon"]{ --bg:#050008; --panel-a:#1a0b24; --panel-b:#0e0614; --edge:#2a0f3a; --lcd-bg:#0a0014; --lcd-txt:#ff4dff; --accent:#00e5ff; --muted:#8a6fa0; --text:#f3e6ff; --red:#ff4d6d; --list-bg:#08000f; --btn-a:#2e1648; --btn-b:#1a0b2a; --viz-bg:#000; }
[data-skin="retro"]{ --bg:#c9c3b0; --panel-a:#e4dfcd; --panel-b:#cfc8b2; --edge:#6d675a; --lcd-bg:#1e2a1e; --lcd-txt:#d7ffb0; --accent:#8a3b12; --muted:#5b5649; --text:#2a2519; --red:#b22222; --list-bg:#f1ecdc; --btn-a:#f4efdf; --btn-b:#d6cfb8; --viz-bg:#1e2a1e; }
[data-skin="ambar"]{ --bg:#120c04; --panel-a:#2b1d0b; --panel-b:#1c1306; --edge:#0a0602; --lcd-bg:#100a00; --lcd-txt:#ffb000; --accent:#ffcc33; --muted:#a07a3c; --text:#ffe2a6; --red:#ff5a36; --list-bg:#0e0900; --btn-a:#4a3412; --btn-b:#2c1f09; --viz-bg:#000; }
[data-skin="oceano"]{ --bg:#041426; --panel-a:#0f2d4f; --panel-b:#0a1f38; --edge:#02080f; --lcd-bg:#00101f; --lcd-txt:#5ce1ff; --accent:#4da6ff; --muted:#6f8fb3; --text:#e3f1ff; --red:#ff6b6b; --list-bg:#06182b; --btn-a:#1d4670; --btn-b:#123052; --viz-bg:#000; }
[data-skin="hifi"]{ --bg:#e9ecf0; --panel-a:#ffffff; --panel-b:#f1f3f6; --edge:#b9c0ca; --lcd-bg:#1b2026; --lcd-txt:#7dffb3; --accent:#2a6fdb; --muted:#5d6675; --text:#1b2026; --red:#d43b3b; --list-bg:#ffffff; --btn-a:#ffffff; --btn-b:#e3e7ed; --viz-bg:#1b2026; }
[data-skin="universo"]{ --bg:#03020a; --panel-a:#1a1235; --panel-b:#0b0819; --edge:#2a1f52; --lcd-bg:#050a1a; --lcd-txt:#9fd8ff; --accent:#c9a6ff; --muted:#7d72a6; --text:#ece6ff; --red:#ff6b9a; --list-bg:#07061a; --btn-a:#2a1f52; --btn-b:#150f2e; --viz-bg:#02030b; }
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:var(--text);display:flex;justify-content:center;padding:16px;min-height:100vh} #app{width:100%;max-width:780px;display:flex;flex-direction:column;gap:12px} .panel{background:linear-gradient(var(--panel-a),var(--panel-b));border:1px solid var(--edge);border-radius:10px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 20px rgba(0,0,0,.25)} .head{display:flex;justify-content:space-between;align-items:center;gap:8px} .brand{display:flex;align-items:center;gap:10px} .logo{width:30px;height:30px;border-radius:6px;object-fit:cover;box-shadow:0 0 10px rgba(0,180,255,.45)} h1{font-size:13px;margin:0;color:var(--muted);letter-spacing:3px;text-transform:uppercase} .lcd{background:var(--lcd-bg);border:2px inset #000;border-radius:6px;padding:10px 14px;font-family:"Courier New",monospace;color:var(--lcd-txt);text-shadow:0 0 6px currentColor;margin-top:8px} .lcd-row{display:flex;gap:12px;align-items:center} .lcd-info{flex:1;min-width:0} .lcd-top{display:flex;justify-content:space-between;align-items:baseline} #time{font-size:36px;font-weight:bold;letter-spacing:2px;cursor:pointer;user-select:none} #dur{font-size:13px;opacity:.8} #title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;margin-top:4px} #album{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;opacity:.75;min-height:1em} #cover{width:72px;height:72px;object-fit:cover;border:1px solid #000;border-radius:4px;display:none;flex-shrink:0} #viz{width:100%;height:90px;display:block;background:var(--viz-bg);border-radius:6px;margin-top:10px;border:1px solid var(--edge)} input[type=range]{accent-color:var(--accent);width:100%} #seek{margin:10px 0 6px} .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px} .btn{background:linear-gradient(var(--btn-a),var(--btn-b));color:var(--text);border:1px solid var(--edge);border-radius:6px;padding:8px 12px;font-size:16px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.25)} .btn:hover{filter:brightness(1.15)} .btn.big{font-size:22px;padding:8px 22px;color:var(--accent)} .btn.tog.on{color:var(--accent);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)} .btn.sm{font-size:13px;padding:6px 10px} .volume{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:160px} .volume input{flex:1} .volume #volpct{min-width:40px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px} .pan{display:flex;align-items:center;gap:6px;min-width:230px} .pan input{flex:1} #panlbl{min-width:70px;font-size:13px;font-variant-numeric:tabular-nums} .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap} #eq{display:flex;justify-content:space-between;gap:4px;height:150px;padding-top:4px} .band{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);flex:1} .band input{writing-mode:vertical-lr;direction:rtl;width:22px;height:120px;margin:0} #list{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;background:var(--list-bg);border-radius:6px;border:1px solid var(--edge)} #list li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid rgba(128,128,128,.15);cursor:pointer;font-size:14px} #list li.current{color:var(--lcd-txt);background:var(--lcd-bg)} #list li.selected{box-shadow:inset 3px 0 0 var(--accent);background:rgba(233,185,73,.12)} #list li.dragging{opacity:.4} #list li.drop-target{box-shadow:inset 0 2px 0 var(--accent)} #list .idx{color:var(--muted);width:28px;text-align:right;font-variant-numeric:tabular-nums} #list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #list .len{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums} #list .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px} #list .nx{background:none;border:1px solid var(--muted);border-radius:4px;color:var(--muted);font-size:11px;padding:1px 6px;cursor:pointer} #list .nx.on{color:var(--accent);border-color:var(--accent)} #list .ren{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px} #list input.rename{flex:1;min-width:0;background:var(--lcd-bg);color:var(--lcd-txt);border:1px solid var(--accent);border-radius:4px;padding:2px 6px;font:inherit} .muted{color:var(--muted);font-size:13px;margin:8px 0 0;min-height:1em} .foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 2px;color:var(--muted);font-size:13px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <div class="head">
      <div class="brand">
        <img class="logo" alt="Audio Tech" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAABmJLR0QA/wD/AP+gvaeTAAAgAElEQVR4nO3de5wkdX3v//e3+ja3ndllF9gLIOCCQWAhyP0WEUS5BI0KaIzRJF7Pzx8aNXpifsaTqMdgTgjQxBFV5D2mVJ/0fN8N9z3NqylzIYhS5v1bJmQ2dVe88x2cXbKQib3A8nB4VXoS1YQfkvwAAAABJRU5ErkJggg==">
        <h1>Audio Tech</h1>
      </div>
      <div class="toggles">
        <button id="togEq" class="btn sm tog on" type="button">Ecualizador</button>
        <button id="togList" class="btn sm tog on" type="button">Lista</button>
      </div>
      <select id="skin" aria-label="Skin">
        <option value="classic">Clásico</option>
        <option value="neon">Neón</option>
        <option value="retro">Retro</option>
        <option value="ambar">Ámbar</option>
        <option value="oceano">Océano</option>
        <option value="hifi">Hi-Fi</option>
        <option value="universo">Universo</option>
      </select>
    </div>

    <div class="lcd">
      <div class="lcd-row">
        <img id="cover" alt="">
        <div class="lcd-info">
          <div class="lcd-top">
            <div id="time" title="Alternar contador">0:00</div>
            <div id="dur">de --:--</div>
          </div>
          <div id="title">Sin pistas</div>
          <div id="album"></div>
        </div>
      </div>
    </div>

    <canvas id="viz"></canvas>
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Posición">
    <div class="controls">
      <button id="prev" class="btn" type="button">⏮</button>
      <button id="play" class="btn big" type="button">▶</button>
      <button id="stop" class="btn" type="button">⏹</button>
      <button id="next" class="btn" type="button">⏭</button>
      <button id="shuffle" class="btn tog" type="button">🔀</button>
      <button id="repeat" class="btn tog" type="button">🔁</button>
      <select id="vizmode" aria-label="Modo visualizador">
        <option value="bars">Barras</option>
        <option value="scope">Osciloscopio</option>
        <option value="vu">Vúmetro</option>
      </select>
      <label class="pan">⇆ <input type="range" id="pan" min="-100" max="100" step="1" value="0"><span id="panlbl">Centro</span></label>
      <label class="volume">🔊 <input type="range" id="vol" min="0" max="100" value="80"><span id="volpct">80%</span></label>
    </div>
  </div>

  <div class="panel" id="eqPanel">
    <div class="row">
      <strong>Ecualizador</strong>
      <select id="preset" aria-label="Preajuste"></select>
    </div>
    <div id="eq"></div>
  </div>

  <div class="panel" id="listPanel">
    <div class="row">
      <span id="count">0 pistas</span>
      <span id="total" class="total">Total: 0:00</span>
    </div>
    <div class="row">
      <select id="qfilter" aria-label="Filtrar por calidad">
        <option value="all">Todas</option>
        <option value="hq">HQ</option>
        <option value="lq">LQ</option>
      </select>
    </div>
    <ol id="list"></ol>
    <p id="status" class="muted"></p>
  </div>

  <footer class="foot">
    <span>Audio Tech</span>
  </footer>
</div>

<script type="module">
  import { initApp } from './src/app/bootstrap.js';
  window.addEventListener('DOMContentLoaded', () => {
    if (!window.AudioTechRuntime) {
      window.AudioTechRuntime = initApp();
    }
  });
</script>
</body>
</html>
